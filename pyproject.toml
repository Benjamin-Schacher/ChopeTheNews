[project]
name = "veille"
version = "0.1.0"
description = "Veille de news : flux RSS de sites + recherches Google News, avec rapport Markdown"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "trafilatura>=1.12",
]

[project.scripts]
veille = "veille.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veille"]
